# Публикация сайта на GitHub Pages.
#
# Заведён потому, что включить Pages через Settings не получалось: кнопка Save
# оставалась неактивной, и сборка не запускалась ни разу. Шаг configure-pages
# с enablement: true включает Pages сам, правами GITHUB_TOKEN.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Сайт лежит в корне: index.html и assets рядом, собирать нечего.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
